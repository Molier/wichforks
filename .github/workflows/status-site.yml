name: Status site

# Builds the live status page and publishes it with GitHub Pages.
# Nothing is committed: the status is read from the host APIs on every run.
# The job does nothing until Pages is enabled for the repository
# (Settings > Pages > Source: GitHub Actions). See docs/SITE.md.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scripts/site.py"
      - ".github/workflows/status-site.yml"
      - ".github/ISSUE_TEMPLATE/experience-report.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: status-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check that Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for this repository; skipping the build." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Build the site
        if: steps.pages.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I scripts/site.py build --out _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
