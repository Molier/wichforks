name: Validate reports and data

on:
  pull_request:
    paths:
      - "data/reports/**"
      - "data/forks.json"
      - "scripts/reports.py"
      - "docs/REPORTS.md"
      - "docs/MKW.md"
      - "docs/DONKEY-KONG.md"
      - "docs/POKOPIA.md"
      - "docs/PERFORMANCE.md"
      - "scripts/performance_data.py"
      - "data/performance-reports.json"
      - "data/lichii-reports.json"
      - "docs/COVERAGE.md"
      - "docs/LICHII-REPORTS.md"
      - "docs/charts/**"
      - "scripts/scrape_lichii.py"
      - "scripts/lichii_summary.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate report files
        run: python -I scripts/reports.py validate
      - name: Check generated report table is up to date
        run: |
          python -I scripts/reports.py render --out /tmp/REPORTS.md
          diff -u docs/REPORTS.md /tmp/REPORTS.md
      - name: Regenerate performance data and charts
        run: python -I scripts/performance_data.py
      - name: Check generated data and charts are up to date
        run: git diff --exit-code -- data/performance-reports.json docs/COVERAGE.md docs/charts
      - name: Check Lichii summary is up to date
        run: |
          python -I scripts/lichii_summary.py
          git diff --exit-code -- docs/LICHII-REPORTS.md
